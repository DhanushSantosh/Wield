name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
    branches: [master, release]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-layer-shell-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: cargo audit
      - run: node --test scripts/release-check.test.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --test-threads=1: cargo test --workspace's biggest test binary
      # (wield-core's command_runner suite) spawns several short-lived child
      # processes in parallel by default. Under the concurrent process churn
      # of standard GitHub Actions runners, this project has repeatedly hit
      # a real flake where a test racing a short timeout against a
      # long-sleeping child sees the child report as exited far too early
      # (see docs/testing.md) - consistent with a rare async-runtime
      # process-reaping mixup under heavy concurrent spawn/reap load, not a
      # logic bug in the code under test. Serializing removes the
      # concurrent-spawn pressure that triggers it; the whole suite still
      # runs in well under a second either way.
      - run: cargo test --workspace --locked -- --test-threads=1
      - run: npm run check

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tauri Linux build dependencies + E2E prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-layer-shell-dev \
            xvfb \
            dbus-x11 \
            imagemagick

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run E2E smoke under a virtual display + fresh D-Bus session
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          xvfb-run -a dbus-run-session -- \
            cargo test -p wield-app --test launch -- --ignored --test-threads=1
