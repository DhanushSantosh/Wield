name: Debug Token

on:
  push:
    tags:
      - "diag-*"

jobs:
  probe:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Replicate tauri-action's exact createRelease call via @actions/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm init -y >/dev/null 2>&1
          npm install @actions/github@9.1.1 @actions/core@3.0.1 >/dev/null 2>&1
          cat > probe.mjs <<'SCRIPT'
          import { getOctokit, context } from '@actions/github';
          (async () => {
            const github = getOctokit(process.env.GITHUB_TOKEN, { baseUrl: 'https://api.github.com' });
            try {
              const res = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: context.ref.replace('refs/tags/', ''),
                name: 'diag',
                body: 'See the AppImage below to download and run this version.',
                draft: true,
                prerelease: false,
                target_commitish: context.sha,
                generate_release_notes: false,
              });
              console.log('SUCCESS', res.status, res.data.html_url);
            } catch (err) {
              console.log('FAILED', err.status, err.message);
              console.log(JSON.stringify(err.response?.headers ?? {}, null, 2));
            }
          })();
          SCRIPT
          node probe.mjs
