name: Debug Token

on:
  push:
    tags:
      - "diag-*"

jobs:
  probe:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Probe GITHUB_TOKEN release-creation scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== token scope headers ==="
          curl -sI -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }} | grep -i "x-oauth-scopes\|x-accepted-oauth-scopes\|x-github-media-type\|github-authentication-token-expiration" || true
          echo "=== attempting direct release creation via gh api, explicit target_commitish=SHA ==="
          gh api repos/${{ github.repository }}/releases -f tag_name="${{ github.ref_name }}" -f name="diag" -f target_commitish="${{ github.sha }}" -F draft=true -F prerelease=false --method POST || echo "FAILED with exit $?"
