name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-layer-shell-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the AppImage
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: apps/wield
          args: --bundles appimage

      - name: Create draft release and attach the AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          appimage=$(find target/release/bundle/appimage -name '*.AppImage')
          gh release create "${{ github.ref_name }}" \
            --title "Wield ${{ github.ref_name }}" \
            --notes "See the AppImage below to download and run this version." \
            --draft \
            "$appimage"
