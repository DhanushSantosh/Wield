name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: wield.flatpak
          manifest-path: packaging/flatpak/io.github.DhanushSantosh.Wield.yml
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Install the Flathub linter
        run: flatpak install -y --noninteractive flathub org.flatpak.Builder

      - name: Lint manifest, AppStream metadata, and built repository
        run: |
          # Known, already-tracked gaps (docs/packaging.md) that must not
          # fail this job: the app has no screenshots yet (placeholder icon,
          # no UI screenshots — both flagged for the Flathub submission and
          # a real follow-up). Any OTHER finding still fails the build.
          allowed='metainfo-missing-screenshots
          appstream-screenshots-not-mirrored-in-ostree'

          lint_or_fail() {
            output=$("$@" 2>&1) || true
            echo "$output"
            echo "$output" | python3 -c "
          import json, sys
          text = sys.stdin.read()
          idx = text.find('{')
          if idx == -1:
              sys.exit(0)
          try:
              data, _ = json.JSONDecoder().raw_decode(text[idx:])
          except ValueError:
              sys.exit(0)
          for e in data.get('errors', []):
              print(e)
          " > /tmp/lint-errors.txt
            echo "$allowed" | sort -u > /tmp/lint-allowed.txt
            sort -u /tmp/lint-errors.txt > /tmp/lint-errors-sorted.txt
            unexpected=$(comm -23 /tmp/lint-errors-sorted.txt /tmp/lint-allowed.txt)
            if [ -n "$unexpected" ]; then
              echo "Unexpected lint error(s):"
              echo "$unexpected"
              exit 1
            fi
          }

          lint_or_fail flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest packaging/flatpak/io.github.DhanushSantosh.Wield.yml
          lint_or_fail flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            appstream packaging/flatpak/io.github.DhanushSantosh.Wield.metainfo.xml
          lint_or_fail flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo repo
