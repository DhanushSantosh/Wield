name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag points to the correct release branch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          release_branch="$(node scripts/release-check.mjs branch "$RELEASE_TAG")"
          git fetch origin "$release_branch"
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$release_branch"

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-layer-shell-dev \
            libgdk-pixbuf-2.0-dev gdk-pixbuf2.0-bin xdg-utils

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2

      - name: Run the same gate used locally
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release-gate.sh "$RELEASE_TAG"

      - name: Check the gate left tracked files untouched
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --porcelain --untracked-files=no >&2
            echo "The release gate modified tracked files (e.g. a lockfile); the tagged source is not what was built." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release-bundle

      - name: Verify transferred artifacts and create review draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-check.mjs manifest "$RELEASE_TAG"
          (cd release-bundle && sha256sum --check SHA256SUMS)
          node scripts/release-check.mjs artifact "$RELEASE_TAG" release-bundle
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite assets" >&2
            exit 1
          fi
          channel=$(node scripts/release-check.mjs manifest "$RELEASE_TAG" | cut -d' ' -f1)
          args=(--verify-tag --draft --title "Wield $RELEASE_TAG" \
            --notes "Review the AppImage, SHA256SUMS, release notes, converter prerequisites and smoke-test evidence before publishing.")
          if [ "$channel" = beta ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest=false)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" release-bundle/*.AppImage release-bundle/SHA256SUMS
          mkdir -p downloaded
          gh release download "$RELEASE_TAG" --dir downloaded
          (cd downloaded && sha256sum --check SHA256SUMS)
