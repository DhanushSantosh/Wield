[workspace]
members = [
  "crates/wield-core",
  "crates/wield-portal",
  "crates/wield-tools",
  "crates/wield-cli",
  "apps/wield/src-tauri"
]
default-members = [
  "crates/wield-core",
  "crates/wield-portal",
  "crates/wield-tools",
  "crates/wield-cli"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/DhanushSantosh/Wield"

[workspace.dependencies]
async-trait = "0.1"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot", "global_shortcuts"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zbus_xml = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "time", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
fuzzy-matcher = "0.3"
libc = "0.2"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
