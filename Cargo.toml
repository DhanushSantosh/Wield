[workspace]
members = [
  "crates/wield-core",
  "crates/wield-portal",
  "crates/wield-tools",
  "crates/wield-cli",
  "apps/wield/src-tauri"
]
default-members = [
  "crates/wield-core",
  "crates/wield-portal",
  "crates/wield-tools",
  "crates/wield-cli"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/DhanushSantosh/Wield"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
