[package]
name = "wield-app"
version = "0.1.0"
description = "Wield — a portal-native Linux utility hub"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "wield_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
wield-core = { path = "../../../crates/wield-core" }
wield-tools = { path = "../../../crates/wield-tools" }
wield-portal = { path = "../../../crates/wield-portal" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.9.5", features = ["tray-icon"] }
zbus.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
uuid.workspace = true
async-trait.workspace = true
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
gtk = "0.18"
gtk-sys = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# Pinned to the version already resolved transitively (via tray-icon's own
# dlopen2 dependency) so this doesn't pull in a second copy - see
# layer_shell::force_commit for why this is a runtime lookup rather than an
# `extern "C"` link-time one.
libloading = "0.7"

[dev-dependencies]
tauri = { version = "2.9.5", features = ["test", "tray-icon"] }
tempfile.workspace = true
